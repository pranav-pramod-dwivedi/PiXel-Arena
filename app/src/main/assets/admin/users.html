<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="../guard.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0B1120; color: #e2e8f0; margin: 0; min-height: 100vh; display: flex; }
        .num { font-family: 'JetBrains Mono', monospace; }

        .sidebar { width: 240px; background: rgba(15,23,42,.85); backdrop-filter: blur(16px); border-right: 1px solid rgba(255,255,255,.06); padding: 24px 0; flex-shrink: 0; display: flex; flex-direction: column; }
        .s-logo { padding: 0 24px 20px; border-bottom: 1px solid rgba(255,255,255,.06); margin-bottom: 12px; font-size: 14px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .s-logo i { color: #3b82f6; }
        .s-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; font-size: 13px; font-weight: 600; color: #94a3b8; text-decoration: none; transition: all .15s; }
        .s-item:hover, .s-item.on { color: #fff; background: rgba(59,130,246,.1); }
        .s-item.on { border-right: 2px solid #3b82f6; }
        .s-item i { width: 20px; text-align: center; font-size: 14px; }
        .s-spacer { flex: 1; }
        .s-logout { color: #f87171; }
        .s-logout:hover { background: rgba(248,113,113,.1); color: #fca5a5; }

        .main { flex: 1; padding: 32px; overflow-y: auto; }
        .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .hdr h1 { font-size: 22px; font-weight: 800; }
        .hdr span { font-size: 12px; color: #64748b; font-weight: 600; }

        .search-bar { display: flex; gap: 12px; margin-bottom: 24px; }
        .search-input { flex: 1; height: 44px; padding: 0 16px; border-radius: 12px; background: rgba(15,23,42,.5); border: 1px solid rgba(255,255,255,.08); color: #fff; font-size: 14px; font-weight: 600; outline: none; }
        .search-input:focus { border-color: #3b82f6; }
        .search-input::placeholder { color: #475569; }
        .search-btn { height: 44px; padding: 0 24px; border-radius: 12px; border: none; background: linear-gradient(135deg,#1d4ed8,#3b82f6); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; }
        .search-btn:active { transform: scale(.97); }

        .user-card { background: rgba(15,23,42,.5); border: 1px solid rgba(255,255,255,.06); border-radius: 16px; padding: 24px; }
        .user-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .user-hdr h2 { font-size: 18px; font-weight: 800; }
        .user-hdr .badge { padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .5px; }

        .field-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
        .field-row label { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
        .field-row input, .field-row select { height: 40px; padding: 0 12px; border-radius: 8px; background: rgba(15,23,42,.6); border: 1px solid rgba(255,255,255,.08); color: #fff; font-size: 13px; font-weight: 600; outline: none; }
        .field-row input:focus, .field-row select:focus { border-color: #3b82f6; }
        .field-row input:disabled { opacity: .5; }

        .btn-save { height: 44px; padding: 0 32px; border-radius: 10px; border: none; background: linear-gradient(135deg,#1d4ed8,#3b82f6); color: #fff; font-size: 13px; font-weight: 700; cursor: pointer; margin-top: 12px; }
        .btn-save:active { transform: scale(.97); }
        .btn-save:disabled { opacity: .5; cursor: not-allowed; }

        .toast { position: fixed; bottom: 32px; right: 32px; background: rgba(15,23,42,.9); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,.1); padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 700; opacity: 0; transition: all .3s; pointer-events: none; z-index: 100; }
        .toast.show { opacity: 1; }

        .not-found { text-align: center; padding: 40px; color: #64748b; font-size: 14px; font-weight: 600; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="s-logo"><i class="fa-solid fa-shield-halved"></i> PIXEL ADMIN</div>
        <a href="dashboard.html" class="s-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        <a href="users.html" class="s-item on"><i class="fa-solid fa-users"></i> Users</a>
        <a href="tournaments.html" class="s-item"><i class="fa-solid fa-trophy"></i> Tournaments</a>
        <a href="rankings.html" class="s-item"><i class="fa-solid fa-ranking-star"></i> Rankings</a>
        <a href="results.html" class="s-item"><i class="fa-solid fa-medal"></i> Results</a>
        <a href="schedule.html" class="s-item"><i class="fa-solid fa-calendar"></i> Schedule</a>
        <div class="s-spacer"></div>
        <a href="#" id="logoutBtn" class="s-item s-logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
    </aside>

    <div class="main">
        <div class="hdr">
            <h1>User Management</h1>
            <span>Search, view, and edit any user</span>
        </div>

        <div class="search-bar">
            <input type="text" id="search-input" class="search-input" placeholder="Search by email address..." autocomplete="off">
            <button class="search-btn" id="search-btn"><i class="fa-solid fa-magnifying-glass mr-1.5"></i>Search</button>
        </div>

        <div id="user-container"></div>
    </div>

    <div id="toast" class="toast"></div>

    <script type="module">
        import { requireAdmin, logoutUser } from '../authGuard.js';
        import { collection, query, where, getDocs, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { db } from '../firebase.js';

        var admin;
        try { admin = await requireAdmin(); } catch(e) { return; }

        function toast(msg) { var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(function(){el.classList.remove('show');}, 2500); }

        var currentUid = null;

        document.getElementById('search-btn').addEventListener('click', searchUser);
        document.getElementById('search-input').addEventListener('keydown', function(e) { if (e.key === 'Enter') searchUser(); });

        async function searchUser() {
            var email = document.getElementById('search-input').value.trim().toLowerCase();
            var container = document.getElementById('user-container');
            if (!email) { container.innerHTML = '<div class="not-found">Enter an email to search</div>'; return; }

            container.innerHTML = '<div class="not-found"><i class="fa-solid fa-spinner spinner"></i> Searching...</div>';

            try {
                var q = query(collection(db, 'users'), where('email', '==', email));
                var snap = await getDocs(q);

                if (snap.empty) {
                    container.innerHTML = '<div class="not-found"><i class="fa-solid fa-circle-exclamation mr-2"></i>No user found with email <strong>' + email + '</strong></div>';
                    return;
                }

                var userDoc = snap.docs[0];
                currentUid = userDoc.id;
                var data = userDoc.data();

                container.innerHTML = renderUserForm(data, currentUid);
                bindFormEvents();
            } catch(e) {
                container.innerHTML = '<div class="not-found">Error searching: ' + e.message + '</div>';
            }
        }

        function renderUserForm(data, uid) {
            var roleBadgeColor = data.role === 'admin' ? 'background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;' : 'background:rgba(59,130,246,.15);color:#60a5fa;';
            return '<div class="user-card">' +
                '<div class="user-hdr">' +
                    '<h2><i class="fa-solid fa-user mr-2 text-blue-400"></i>' + (data.name || 'No Name') + '</h2>' +
                    '<span class="badge" style="' + roleBadgeColor + '">' + (data.role || 'player') + '</span>' +
                '</div>' +
                '<div class="field-row"><label>UID</label><input value="' + uid + '" disabled></div>' +
                '<div class="field-row"><label>Email</label><input value="' + (data.email || '') + '" disabled></div>' +
                '<div class="field-row"><label>Name</label><input type="text" id="f-name" value="' + esc(data.name || '') + '"></div>' +
                '<div class="field-row"><label>Mobile</label><input type="text" id="f-mobile" value="' + esc(data.mobile || '') + '"></div>' +
                '<div class="field-row"><label>Address</label><input type="text" id="f-address" value="' + esc(data.address || '') + '"></div>' +
                '<div class="field-row"><label>Profile Photo</label><input type="text" id="f-photo" value="' + esc(data.profilePhoto || '') + '" placeholder="URL or data:uri"></div>' +
                '<div class="field-row"><label>Coins</label><input type="number" id="f-coins" value="' + (data.coins || 0) + '"></div>' +
                '<div class="field-row"><label>Wins</label><input type="number" id="f-wins" value="' + (data.wins || 0) + '"></div>' +
                '<div class="field-row"><label>Role</label><select id="f-role"><option value="player"' + (data.role === 'player' ? ' selected' : '') + '>player</option><option value="admin"' + (data.role === 'admin' ? ' selected' : '') + '>admin</option></select></div>' +
                '<div class="field-row"><label>Created</label><input value="' + (data.createdAt ? new Date(data.createdAt.seconds * 1000).toLocaleString() : 'N/A') + '" disabled></div>' +
                '<button class="btn-save" id="save-user-btn"><i class="fa-solid fa-floppy-disk mr-1.5"></i>Save Changes</button>' +
            '</div>';
        }

        function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        function bindFormEvents() {
            document.getElementById('save-user-btn').addEventListener('click', saveUser);
        }

        async function saveUser() {
            if (!currentUid) return;
            var btn = document.getElementById('save-user-btn');
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner spinner mr-1.5"></i>Saving...';

            var updateData = {
                name: document.getElementById('f-name').value.trim(),
                mobile: document.getElementById('f-mobile').value.trim(),
                address: document.getElementById('f-address').value.trim(),
                profilePhoto: document.getElementById('f-photo').value.trim(),
                coins: Number(document.getElementById('f-coins').value) || 0,
                wins: Number(document.getElementById('f-wins').value) || 0,
                role: document.getElementById('f-role').value,
            };

            if (!updateData.name) { toast('Name is required'); btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i>Save Changes'; return; }

            try {
                await updateDoc(doc(db, 'users', currentUid), updateData);
                toast('User updated successfully');
            } catch(e) {
                toast('Save failed: ' + e.message);
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-floppy-disk mr-1.5"></i>Save Changes';
        }

        document.getElementById('logoutBtn').addEventListener('click', function(e) { e.preventDefault(); logoutUser(); });
    </script>
</body>
</html>
