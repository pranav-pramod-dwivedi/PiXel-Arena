<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin · Pixel Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="../guard.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap');
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0B1120; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; }
        .num { font-family: 'JetBrains Mono', monospace; }

        .bg-glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: radial-gradient(circle at center, #1E3A8A 0%, #0B1120 100%); }
        .bg-glow::before, .bg-glow::after { content: ""; position: absolute; border-radius: 50%; filter: blur(80px); opacity: .25; }
        .bg-glow::before { width: 62vw; height: 62vw; top: -20vw; left: -14vw; background: radial-gradient(circle at 35% 35%, #3b82f6, transparent 68%); }
        .bg-glow::after { width: 58vw; height: 58vw; bottom: -22vw; right: -16vw; background: radial-gradient(circle at 65% 65%, #1d4ed8, transparent 68%); }

        .glass { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,.08); border-radius: 20px; box-shadow: 0 12px 34px -14px rgba(0,0,0,.6); }
        .glass-input { width: 100%; height: 48px; padding: 0 16px; border-radius: 12px; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,.1); color: #fff; font-size: 14px; font-weight: 600; outline: none; transition: border-color .2s; }
        .glass-input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
        .glass-input::placeholder { color: #64748b; }

        .btn-primary { height: 48px; border-radius: 12px; border: none; background: linear-gradient(135deg, #1d4ed8, #3b82f6); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; transition: transform .15s; box-shadow: 0 8px 20px rgba(29,78,216,.35); }
        .btn-primary:active { transform: scale(.97); }
        .btn-primary:disabled { opacity: .5; cursor: not-allowed; }

        .tap { transition: transform .15s; } .tap:active { transform: scale(.95); }

        .page { animation: fadeIn .4s ease-out forwards; margin:auto; }
        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="page glass p-8 relative z-10 w-full max-w-sm text-center">
        <div class="w-14 h-14 rounded-2xl flex items-center justify-center mx-auto mb-4" style="background:linear-gradient(135deg,rgba(29,78,216,.3),rgba(59,130,246,.15));">
            <i class="fa-solid fa-shield-halved text-blue-400 text-2xl"></i>
        </div>
        <h1 class="text-2xl font-extrabold mb-1">Admin Panel</h1>
        <p class="text-sm text-slate-400 mb-6 font-semibold">Verifying access...</p>
        <div id="status" class="text-xs font-bold text-slate-500">Checking credentials</div>
    </div>

    <script type="module">
        import { requireAdmin } from '../authGuard.js';
        try {
            await requireAdmin();
            window.location.replace('dashboard.html');
        } catch(e) {
            document.getElementById('status').textContent = 'Redirecting to login...';
            setTimeout(function() { window.location.replace('../login.html'); }, 1500);
        }
    </script>
</body>
</html>
