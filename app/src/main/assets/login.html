<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign In | Pixel Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
        
        :root {
            --nv-bg:#0B1120; 
            --nv-bg2:#13254E;
            --nv-ink:#ffffff; 
            --nv-ink2:#94a3b8; 
            --nv-sub:#64748b;
            --nv-blue:#3b82f6; 
            --nv-green:#10b981; 
            --nv-red:#ef4444; 
            --nv-purple:#8b5cf6; 
            --nv-orange:#f59e0b;
            --nv-card1:#1d4ed8; 
            --nv-card2:#3b82f6;
            --nv-glass:rgba(15, 23, 42, 0.65);
            --nv-glass-brd:rgba(255, 255, 255, 0.12);
            --nv-glass-hi:rgba(255, 255, 255, 0.2);
            --nv-shadow:0 18px 44px -20px rgba(0, 0, 0, 0.6);
            --lg-radius:28px;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing:border-box; margin:0; padding:0; }
        html, body { width:100%; height:100%; margin:0; padding:0; }
        body { width:100%; height:100%; margin:0; padding:0; font-family:'Plus Jakarta Sans',sans-serif; background:var(--nv-bg); color:var(--nv-ink); opacity:0; }
        .flex-center { width:100%; height:100%; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .num { font-family: 'Space Grotesk', sans-serif; }

        /* ---- ambient bg ---- */
        .lg-bg { position:fixed; inset:0; z-index:0; overflow:hidden; background:radial-gradient(circle at center, #1E3A8A 0%, #13254E 35%, #0B1120 100%); }
        .lg-bg::before, .lg-bg::after { content:""; position:absolute; border-radius:50%; filter:blur(80px); opacity:.35; animation:lgFloat 20s ease-in-out infinite; }
        .lg-bg::before { width:62vw;height:62vw;top:-20vw;left:-14vw; background:radial-gradient(circle at 35% 35%,#3b82f6,transparent 68%); }
        .lg-bg::after  { width:58vw;height:58vw;bottom:-22vw;right:-16vw; background:radial-gradient(circle at 65% 65%,#1d4ed8,transparent 68%); animation-delay:-9s; }
        .lg-blob { position:fixed; z-index:0; width:44vw;height:44vw; border-radius:50%; filter:blur(90px); background:radial-gradient(circle,rgba(59,130,246,.25),transparent 70%); top:34%; left:22%; animation:lgFloat 26s ease-in-out infinite -5s; pointer-events:none; }
        @keyframes lgFloat { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(5vw,-4vw) scale(1.1)} }

        /* ---- liquid glass surface ---- */
        .liquid-glass {
            position:relative; border-radius:var(--lg-radius);
            background:var(--nv-glass);
            backdrop-filter:blur(30px) saturate(150%); -webkit-backdrop-filter:blur(30px) saturate(150%);
            box-shadow:0 12px 34px -14px rgba(0,0,0,.6), inset 0 0.5px 0.5px rgba(255,255,255,.2), inset 0 0 0 0.5px rgba(255,255,255,.1);
            isolation:isolate; color:var(--nv-ink);
        }
        .liquid-glass::before {
            content:""; position:absolute; inset:0; border-radius:inherit; padding:0.8px; pointer-events:none; z-index:2;
            background:linear-gradient(150deg, rgba(255,255,255,.25) 0%, rgba(255,255,255,.05) 40%, rgba(255,255,255,.01) 60%, rgba(255,255,255,.15) 100%);
            -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite:xor; mask-composite:exclude;
            opacity:.8;
        }
        .liquid-glass::after {
            content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:1;
            background:radial-gradient(120% 80% at 12% 0%, rgba(255,255,255,.08), transparent 55%);
            opacity:.8;
        }

        .lg-sheen { position:absolute; inset:0; z-index:3; pointer-events:none; overflow:hidden; border-radius:inherit; }
        .lg-sheen::before {
            content:""; position:absolute; inset:0;
            background:linear-gradient(115deg, transparent 28%, rgba(255,255,255,.1) 46%, rgba(255,255,255,.02) 54%, transparent 72%);
            transform:translateX(-45%); animation:lgSheen 6.5s ease-in-out infinite;
        }
        @keyframes lgSheen { 0%,100%{transform:translateX(-45%)} 50%{transform:translateX(45%)} }

        /* ---- glow orb ---- */
        .glow-orb { position:fixed; z-index:0; width:50vw;height:50vw;border-radius:50%;filter:blur(100px);opacity:.2; background:radial-gradient(circle,#2563eb,transparent 60%); top:38%; left:30%; animation:float2 20s ease-in-out infinite -4s; pointer-events:none; }
        @keyframes float2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(5vw,-4vw) scale(1.12)} }

        /* ---- page transitions ---- */
        .page { animation:pageIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards; margin:0; }
        .page.out { animation:pageOut 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes pageIn { 0%{opacity:0;transform:scale(0.95) translateY(10px);filter:blur(8px)} 100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)} }
        @keyframes pageOut { 0%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)} 100%{opacity:0;transform:scale(0.95) translateY(-10px);filter:blur(8px)} }

        /* ---- form toggle ---- */
        .form-box { transition:opacity 0.35s cubic-bezier(0.16,1,0.3,1), transform 0.35s cubic-bezier(0.16,1,0.3,1); }
        .form-box.hidden-form { position:absolute; opacity:0; transform:translateY(12px); pointer-events:none; }
        .form-wrap { position:relative; }

        /* ---- input glow ---- */
        .nv-input {
            width:100%; height:48px; padding:0 16px; border-radius:14px;
            background:rgba(15, 23, 42, 0.6); border:1px solid var(--nv-glass-brd);
            font-family:'Space Grotesk',sans-serif; font-size:14px; font-weight:600; color:var(--nv-ink);
            outline:none; transition:border-color 0.25s, box-shadow 0.25s;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.05), var(--nv-shadow);
        }
        .nv-input::placeholder { color:var(--nv-sub); }
        .nv-input:focus { border-color:var(--nv-blue); box-shadow:inset 0 1px 0 rgba(255,255,255,.1), 0 0 0 3px rgba(59,130,246,.25), var(--nv-shadow); }
        .nv-input.error { border-color:var(--nv-red); }

        .btn-primary {
            width:100%; height:56px; border-radius:28px; border:none;
            background:linear-gradient(135deg,var(--nv-card1),var(--nv-card2));
            color:#fff; font:inherit; font-size:15px; font-weight:800; cursor:pointer;
            position:relative; overflow:hidden; isolation:isolate;
            box-shadow:0 10px 24px rgba(29,78,216,.45), inset 0 1px 0 rgba(255,255,255,.3);
            transition:transform 0.2s cubic-bezier(0.16,1,0.3,1);
            animation:btnPulse 2.5s ease-in-out infinite alternate;
        }
        .btn-primary::before {
            content:''; position:absolute; top:0; left:0; right:0; height:50%;
            background:linear-gradient(180deg,rgba(255,255,255,.25),transparent);
            border-radius:28px 28px 0 0; pointer-events:none; z-index:2;
        }
        .btn-primary:active { transform:scale(0.96); }
        @keyframes btnPulse {
            0% { box-shadow:0 8px 24px rgba(29,78,216,.35), inset 0 1px 0 rgba(255,255,255,.3); }
            100% { box-shadow:0 16px 40px rgba(59,130,246,.55), 0 0 20px rgba(59,130,246,.3), inset 0 1px 0 rgba(255,255,255,.3); }
        }

        .tap { transition:transform .16s cubic-bezier(.16,1,.3,1); } .tap:active { transform:scale(.95); }

        /* staggered entrance */
        .fade-el { opacity:0; transform:translateY(12px); }
        .page .fade-el { animation:fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
        .page .fade-el:nth-child(1) { animation-delay:0.05s; }
        .page .fade-el:nth-child(2) { animation-delay:0.12s; }
        .page .fade-el:nth-child(3) { animation-delay:0.19s; }
        .page .fade-el:nth-child(4) { animation-delay:0.26s; }
        .page .fade-el:nth-child(5) { animation-delay:0.33s; }
        .page .fade-el:nth-child(6) { animation-delay:0.40s; }
        @keyframes fadeUp { 0%{opacity:0;transform:translateY(12px);filter:blur(4px)} 100%{opacity:1;transform:translateY(0);filter:blur(0)} }

        .scroll-fields::-webkit-scrollbar { width:3px; }
        .scroll-fields::-webkit-scrollbar-track { background:transparent; }
        .scroll-fields::-webkit-scrollbar-thumb { background:rgba(59,130,246,.3); border-radius:2px; }

        /* Modal Styles */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 100;
            background: rgba(11, 17, 32, 0.8); backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; padding: 20px;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box {
            width: 100%; max-width: 320px; padding: 24px;
            background: #0f172a; border-radius: 24px; text-align: center;
            border: 1px solid var(--nv-glass-brd); box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-icon { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; }
    </style>
</head>
<body>
    <div class="lg-bg"></div>
    <div class="lg-blob"></div>
    <div class="glow-orb"></div>

    <div class="flex-center">
        <div class="page relative z-10" id="pageRoot" style="width:min(86vw,440px);padding:0 20px">
            <div class="form-wrap">
                <!-- LOGIN -->
                <div class="form-box" id="loginBox">
                    <div class="text-center mb-8 fade-el">
                        <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,rgba(29,78,216,.4),rgba(59,130,246,.2));display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                            <i class="fa-solid fa-gamepad text-blue-400 text-2xl"></i>
                        </div>
                        <h1 class="text-[28px] font-extrabold" style="color:var(--nv-ink)">Welcome back</h1>
                        <p class="text-sm mt-1" style="color:var(--nv-sub)">Sign in to your account</p>
                    </div>

                    <div class="liquid-glass rounded-3xl p-6 mb-4 fade-el" style="--lg-radius:24px">
                        <div class="lg-sheen"></div>
                        <div class="mb-4" style="position:relative;z-index:4">
                            <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Email or phone</label>
                            <input type="text" placeholder="Enter your email or phone" class="nv-input" id="loginEmail">
                        </div>
                        <div class="mb-2" style="position:relative;z-index:4">
                            <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Password</label>
                            <input type="password" placeholder="Enter your password" class="nv-input" id="loginPass">
                        </div>
                        <div class="flex items-center justify-between mt-3 mb-6" style="position:relative;z-index:4">
                            <label class="flex items-center gap-2 cursor-pointer tap" style="color:var(--nv-sub)">
                                <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-gray-500" style="accent-color:var(--nv-blue)">
                                <span class="text-xs font-bold uppercase tracking-wider">Remember me</span>
                            </label>
                            <a href="forgot.html" class="text-xs font-bold" style="color:var(--nv-blue)">Forgot password?</a>
                        </div>
                        <div style="position:relative;z-index:4">
                            <button class="btn-primary" id="loginBtn"><span id="loginBtnText">Sign In</span> <i class="fa-solid fa-spinner fa-pulse hidden" id="loginBtnSpinner"></i></button>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 mb-5 fade-el">
                        <div class="flex-1 h-px" style="background:var(--nv-glass-brd)"></div>
                        <span class="text-xs font-bold uppercase" style="color:var(--nv-sub)">or</span>
                        <div class="flex-1 h-px" style="background:var(--nv-glass-brd)"></div>
                    </div>

                    <div class="flex gap-3 mb-5 fade-el">
                        <button class="flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold tap liquid-glass text-white" id="googleLoginBtn" style="--lg-radius:16px">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                            Google
                        </button>
                        <button class="flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold tap liquid-glass text-white" id="facebookLoginBtn" style="--lg-radius:16px">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill="#1877F2"/></svg>
                            Facebook
                        </button>
                    </div>

                    <div class="text-center fade-el">
                        <p class="text-sm" style="color:var(--nv-sub)">Don't have an account? <a href="#" onclick="toggleForm()" style="color:var(--nv-blue)" class="font-bold">Sign up</a></p>
                    </div>
                </div>

                <!-- SIGN UP -->
                <div class="form-box hidden-form" id="signupBox">
                    <div class="text-center mb-8 fade-el">
                        <div style="width:56px;height:56px;border-radius:18px;background:linear-gradient(135deg,rgba(29,78,216,.4),rgba(59,130,246,.2));display:flex;align-items:center;justify-content:center;margin:0 auto 16px">
                            <i class="fa-solid fa-trophy text-blue-400 text-2xl"></i>
                        </div>
                        <h1 class="text-[28px] font-extrabold" style="color:var(--nv-ink)">Create account</h1>
                        <p class="text-sm mt-1" style="color:var(--nv-sub)">Join the battle</p>
                    </div>

                    <div class="liquid-glass rounded-3xl fade-el" style="--lg-radius:24px;display:flex;flex-direction:column;max-height:380px">
                        <div class="lg-sheen"></div>
                        <div class="p-5 overflow-y-auto flex-1 scroll-fields" style="position:relative;z-index:4">
                            <div class="mb-3.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Full name</label>
                                <input type="text" id="sName" placeholder="Enter your name" class="nv-input">
                            </div>
                            <div class="mb-3.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Mobile number</label>
                                <input type="tel" id="sMobile" inputmode="numeric" pattern="[0-9]*" placeholder="Enter your mobile number" class="nv-input" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
                            </div>
                            <div class="mb-3.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Email</label>
                                <input type="email" id="sEmail" placeholder="Enter your email" class="nv-input">
                            </div>
                            <div class="mb-3.5">
                                <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Password</label>
                                <input type="password" id="sPass" placeholder="Create a password" class="nv-input">
                            </div>
                            <div class="mb-1">
                                <label class="text-[11px] font-bold uppercase tracking-wider mb-1.5 block" style="color:var(--nv-ink2)">Confirm password</label>
                                <input type="password" id="sConfirm" placeholder="Re-enter password" class="nv-input">
                            </div>
                        </div>
                        <div style="position:relative;z-index:4;flex-shrink:0;padding:0 16px 16px">
                            <button class="btn-primary" id="signupBtn" style="height:50px;font-size:14px"><span id="signupBtnText">Create Account</span> <i class="fa-solid fa-spinner fa-pulse hidden" id="signupBtnSpinner"></i></button>
                        </div>
                    </div>

                    <div class="flex items-center gap-3 mb-5 fade-el">
                        <div class="flex-1 h-px" style="background:var(--nv-glass-brd)"></div>
                        <span class="text-xs font-bold uppercase" style="color:var(--nv-sub)">or</span>
                        <div class="flex-1 h-px" style="background:var(--nv-glass-brd)"></div>
                    </div>

                    <div class="flex gap-3 mb-5 fade-el">
                        <button class="flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold tap liquid-glass text-white" id="googleSignupBtn" style="--lg-radius:16px">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                            Google
                        </button>
                        <button class="flex-1 h-12 rounded-2xl flex items-center justify-center gap-2 text-sm font-bold tap liquid-glass text-white" id="facebookSignupBtn" style="--lg-radius:16px">
                            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z" fill="#1877F2"/></svg>
                            Facebook
                        </button>
                    </div>

                    <div class="text-center fade-el">
                        <p class="text-sm" style="color:var(--nv-sub)">Already have an account? <a href="#" onclick="toggleForm()" style="color:var(--nv-blue)" class="font-bold">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <div class="modal-icon" id="modalIcon" style="background:rgba(59,130,246,.2);color:var(--nv-blue)">
                <i class="fa-solid fa-check text-xl"></i>
            </div>
            <h3 class="text-lg font-extrabold mb-1" id="modalTitle" style="color:var(--nv-ink)">Success</h3>
            <p class="text-sm mb-5" id="modalMsg" style="color:var(--nv-sub)">Done.</p>
            <button id="modalBtn" style="width:100%;height:48px;border:none;border-radius:14px;font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--nv-card1),var(--nv-card2));box-shadow:0 8px 20px rgba(29,78,216,.4);cursor:pointer">OK</button>
        </div>
    </div>

    <script src="guard.js"></script>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { loginWithPersistence, setRememberMe, getRememberMe } from './authGuard.js';
        import {
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signInWithPopup,
            GoogleAuthProvider,
            signOut,
            onAuthStateChanged,
            setPersistence,
            browserLocalPersistence,
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import {
            doc,
            setDoc,
            serverTimestamp,
            getDoc,
        } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        let authResolved = false;

        function showModal(icon, title, msg, color, btnText, cb) {
            const m = document.getElementById('modal');
            document.getElementById('modalIcon').innerHTML = icon;
            document.getElementById('modalIcon').style.color = color || 'var(--nv-blue)';
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMsg').textContent = msg;
            document.getElementById('modalBtn').textContent = btnText || 'OK';
            document.getElementById('modalBtn').onclick = function() { closeModal(); if (cb) cb(); };
            m.classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        function toggleForm() {
            const login = document.getElementById('loginBox');
            const signup = document.getElementById('signupBox');
            login.classList.toggle('hidden-form');
            signup.classList.toggle('hidden-form');
        }

        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            const spinner = document.getElementById(btnId + 'Spinner');
            if (btn) btn.disabled = loading;
            if (spinner) spinner.classList.toggle('hidden', !loading);
        }

        const isFileProtocol = location.protocol === 'file:';
        if (isFileProtocol) {
            document.querySelectorAll('#googleLoginBtn, #googleSignupBtn, #facebookLoginBtn, #facebookSignupBtn').forEach(btn => {
                btn.style.display = 'none';
            });
            const orDividers = document.querySelectorAll('.flex.gap-3.mb-5');
            orDividers.forEach(el => {
                const notice = document.createElement('p');
                notice.className = 'text-xs text-center font-bold';
                notice.style.color = 'var(--nv-sub)';
                notice.textContent = 'Social login requires a web server (try: npx serve .)';
                el.parentElement.insertBefore(notice, el);
                el.remove();
            });
            const orLabels = document.querySelectorAll('.flex.items-center.gap-3');
            orLabels.forEach(el => el.remove());
        }

        function getErrorMessage(error) {
            const map = {
                'auth/user-not-found': 'No account found.',
                'auth/wrong-password': 'Incorrect password.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/email-already-in-use': 'Account already exists. Please sign in.',
                'auth/invalid-email': 'Invalid email address.',
                'auth/weak-password': 'Password must be at least 6 characters.',
                'auth/too-many-requests': 'Too many attempts. Try again later.',
                'auth/network-request-failed': 'Network error. Check your connection.',
                'auth/popup-closed-by-user': 'Sign-in was cancelled.',
                'auth/cancelled-popup-request': 'Sign-in was cancelled.',
                'auth/popup-blocked': 'Popup was blocked. Allow popups or use email sign in.',
                'auth/operation-not-allowed': 'Google sign-in is not enabled. Use email/password or open via a web server.',
                'auth/unauthorized-domain': 'Social login not supported on file:// protocol. Use a web server (npx serve .) or sign in with email.',
                'auth/account-exists-with-different-credential': 'An account already exists with this email.',
            };
            return map[error.code] || 'Something went wrong. Please try again.';
        }

        async function signIn() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPass').value;
            const remember = document.getElementById('rememberMe').checked;
            if (!email || !password) {
                showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing fields', 'Please enter your email and password.', '#ef4444');
                return;
            }
            setLoading('loginBtn', true);
            try {
                await loginWithPersistence(email, password, remember);
                window.location.replace('home.html');
            } catch (error) {
                showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Sign in failed', getErrorMessage(error), '#ef4444');
            } finally {
                setLoading('loginBtn', false);
            }
        }

        async function handleSignup() {
            const name = document.getElementById('sName').value.trim();
            const mobile = document.getElementById('sMobile').value.trim();
            const email = document.getElementById('sEmail').value.trim();
            const password = document.getElementById('sPass').value;
            const confirm = document.getElementById('sConfirm').value;

            document.querySelectorAll('.nv-input').forEach(el => el.classList.remove('error'));

            if (!name) { document.getElementById('sName').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing field', 'Please enter your name.', '#ef4444'); return; }
            if (!mobile) { document.getElementById('sMobile').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing field', 'Please enter your mobile number.', '#ef4444'); return; }
            if (!/^\d{10,15}$/.test(mobile)) { document.getElementById('sMobile').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Invalid number', 'Enter a valid 10-15 digit phone number.', '#ef4444'); return; }
            if (!email) { document.getElementById('sEmail').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing field', 'Please enter your email.', '#ef4444'); return; }
            if (!password) { document.getElementById('sPass').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing field', 'Please enter a password.', '#ef4444'); return; }
            if (!confirm) { document.getElementById('sConfirm').classList.add('error'); showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Missing field', 'Please confirm your password.', '#ef4444'); return; }

            if (password.length < 6) {
                document.getElementById('sPass').classList.add('error');
                showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Weak password', 'Password must be at least 6 characters.', '#ef4444');
                return;
            }

            if (password !== confirm) {
                document.getElementById('sConfirm').classList.add('error');
                showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Mismatch', 'Passwords do not match.', '#ef4444');
                return;
            }

            setLoading('signupBtn', true);
            try {
                /* Duplicate email is caught by Firebase Auth below */

                const cred = await createUserWithEmailAndPassword(auth, email, password);

                try {
                    await setDoc(doc(db, 'users', cred.user.uid), {
                        name,
                        email,
                        mobile,
                        createdAt: serverTimestamp(),
                        coins: 0,
                        wins: 0,
                        profilePhoto: '',
                        role: 'player',
                    });
                } catch (e) {
                    /* Firestore profile write failed — account still exists in Auth */
                }

                await signOut(auth);
                showModal(
                    '<i class="fa-solid fa-check-circle text-xl"></i>',
                    'Account created',
                    'Welcome to PIXEL ARENA!',
                    '#10b981',
                    'Go to Sign In',
                    () => { window.location.replace('login.html'); }
                );
            } catch (error) {
                showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Sign up failed', getErrorMessage(error), '#ef4444');
            } finally {
                setLoading('signupBtn', false);
            }
        }

        async function googleSignIn() {
            if (location.protocol === 'file:') {
                showModal('<i class="fa-solid fa-server text-xl"></i>', 'Web server required', 'Google sign-in requires HTTPS. Run a local server: npx serve .', '#f59e0b', 'OK');
                return;
            }
            const buttons = [document.getElementById('googleLoginBtn'), document.getElementById('googleSignupBtn')];
            buttons.forEach(b => { if (b) b.disabled = true; });
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                try {
                    const userDoc = await getDoc(doc(db, 'users', user.uid));
                    if (!userDoc.exists()) {
                        await setDoc(doc(db, 'users', user.uid), {
                            name: user.displayName || 'Player',
                            email: user.email,
                            mobile: user.phoneNumber || '',
                            createdAt: serverTimestamp(),
                            coins: 0,
                            wins: 0,
                            profilePhoto: user.photoURL || '',
                            role: 'player',
                        });
                    }
                } catch (e) { /* Firestore write unavailable — auth succeeded */ }
                window.location.replace('home.html');
            } catch (error) {
                if (error.code !== 'auth/popup-closed-by-user' && error.code !== 'auth/cancelled-popup-request') {
                    showModal('<i class="fa-solid fa-circle-exclamation text-xl"></i>', 'Google sign in failed', getErrorMessage(error), '#ef4444');
                }
            } finally {
                buttons.forEach(b => { if (b) b.disabled = false; });
            }
        }

        function facebookClick() {
            showModal('<i class="fa-brands fa-facebook text-xl"></i>', 'Coming soon', 'Facebook login is coming soon.', '#8b5cf6');
        }

        /* Restore Remember Me checkbox */
        try { document.getElementById('rememberMe').checked = getRememberMe(); } catch(e) {}

        const unsubscribe = onAuthStateChanged(auth, (user) => {
            if (user && !authResolved) {
                authResolved = true;
                window.location.replace('home.html');
                return;
            }
            if (!authResolved) {
                authResolved = true;
                document.body.style.opacity = '1';
            }
        });

        setTimeout(() => {
            if (!authResolved) {
                authResolved = true;
                document.body.style.opacity = '1';
            }
        }, 4000);

        document.getElementById('loginBtn').addEventListener('click', signIn);
        document.getElementById('signupBtn').addEventListener('click', handleSignup);
        document.getElementById('googleLoginBtn').addEventListener('click', googleSignIn);
        document.getElementById('googleSignupBtn').addEventListener('click', googleSignIn);
        document.getElementById('facebookLoginBtn').addEventListener('click', facebookClick);
        document.getElementById('facebookSignupBtn').addEventListener('click', facebookClick);

        window.showModal = showModal;
        window.closeModal = closeModal;
        window.toggleForm = toggleForm;
    </script>
</body>
</html>
