<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https:; script-src 'self' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://www.gstatic.com https://fonts.googleapis.com 'unsafe-inline'; style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL ARENA - Edit Profile</title>
    <script src="guard.js"></script>
    <script src="app.js?v=16"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=JetBrains+Mono:wght@600;700;800&display=swap');

        :root {
            --surface: #ECEFF1;
            --ewc-black: #070A10;
            --ewc-card-bg: #0F131C;
            --ewc-lime: #CCFF00;
            --ewc-gold: #B88E24;
            --wlt-green: #22C55E;
        }

        * {
            font-family: 'Chakra Petch', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body {
            background-color: var(--surface);
            color: #0F172A;
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 95px;
        }

        .font-ewc { text-transform: uppercase; }

        .sticky-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(236,239,241,.95); backdrop-filter: blur(12px);
            border-bottom: 1.5px solid #CBD5E1;
        }

        .cap-btn {
            width: 36px; height: 36px; border-radius: 8px;
            background: #FFFFFF; border: 1.5px solid #CBD5E1;
            display: flex; align-items: center; justify-content: center;
        }

        .spring { transition: transform .2s ease; }
        .spring:active { transform: scale(.96); }

        .info-group {
            background: #FFFFFF; border: 1.5px solid #CBD5E1; border-radius: 12px;
            overflow: hidden; box-shadow: 0 2px 5px rgba(7, 10, 16, 0.05);
        }

        .section-head {
            font-size: 12px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1.5px; color: #475569;
        }

        .ewc-input {
            width: 100%; padding: 12px 14px; border-radius: 8px;
            background: #FFFFFF; border: 1.5px solid #CBD5E1;
            font-size: 13px; font-weight: 700; color: #0F172A;
            outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .ewc-input:focus { border-color: var(--ewc-black); box-shadow: 0 0 0 3px rgba(7,10,16,.08); }
        .ewc-input.error { border-color: #f0506e; }
        .ewc-input:disabled { background: #F1F5F9; color: #64748B; }

        .btn-save {
            width: 100%; height: 50px; border-radius: 10px; border: none;
            background: var(--ewc-black); color: #fff; font-size: 13px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }
        .btn-save:active { transform: scale(.97); }
        .btn-save:disabled { opacity: .5; cursor: not-allowed; }

        .btn-outline {
            width: 100%; height: 50px; border-radius: 10px;
            background: transparent; border: 1.5px solid #CBD5E1;
            font-size: 13px; font-weight: 800; text-transform: uppercase;
            letter-spacing: 1px; cursor: pointer; color: #0F172A;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }
        .btn-outline:active { transform: scale(.97); border-color: var(--ewc-black); }

        .app-bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            background: #FFFFFF; border-top: 1.5px solid #CBD5E1;
            display: grid; grid-template-columns: repeat(5, 1fr);
            padding: 10px 0 12px 0; box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
            color: #64748B; font-size: 10px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.5px; text-decoration: none; transition: color 0.15s ease;
        }
        .nav-item.active-ewc { color: var(--ewc-black); font-weight: 900; }
        .nav-item.active-ewc svg { color: var(--ewc-gold); filter: drop-shadow(0 2px 6px rgba(184,142,36,0.35)); }

        .skeleton-block { background: #E2E8F0; position: relative; overflow: hidden; border-radius: 4px; }
        .skeleton-block::after {
            content: ""; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            animation: shimmer 0.8s infinite linear;
        }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        #skeleton-screen { position: fixed; inset: 0; background: var(--surface); z-index: 100; transition: opacity 0.4s ease-out; }
        .loaded #skeleton-screen { opacity: 0; pointer-events: none; }
        #main-content { opacity: 0; transform: translateY(10px); transition: 0.4s ease-out; }
        .loaded #main-content { opacity: 1; transform: translateY(0); }

        .toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--ewc-black); color: #fff; padding: 12px 24px; border-radius: 10px;
            font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            opacity: 0; transition: all 0.3s ease; z-index: 200; pointer-events: none;
            white-space: nowrap; border: 1px solid var(--ewc-lime);
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .modal-overlay {
            position: fixed; inset: 0; z-index: 150; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { width: calc(100% - 48px); max-width: 320px; padding: 28px 24px 24px;
            background: #FFFFFF; border-radius: 20px; border: 1px solid #CBD5E1;
            transform: scale(0.9); transition: transform 0.35s cubic-bezier(0.16,1,0.3,1); }
        .modal-overlay.show .modal-box { transform: scale(1); }
    </style>
</head>
<body class="max-w-md mx-auto relative">

    <div id="skeleton-screen" class="p-6">
        <div class="w-10 h-10 rounded-md skeleton-block mb-8"></div>
        <div class="flex flex-col items-center mb-10">
            <div class="w-24 h-24 rounded-full skeleton-block mb-4"></div>
            <div class="w-32 h-6 rounded-md skeleton-block mb-2"></div>
            <div class="w-20 h-3 rounded-md skeleton-block"></div>
        </div>
        <div class="space-y-6">
            <div class="h-32 w-full rounded-md skeleton-block"></div>
            <div class="h-48 w-full rounded-md skeleton-block"></div>
        </div>
    </div>

    <div id="main-content" class="min-h-screen pb-32" style="padding-top: 58px;">

        <header class="sticky-header">
            <a href="profile.html" class="cap-btn spring">
                <svg class="w-4 h-4 text-slate-800" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M15 18l-6-6 6-6"/></svg>
            </a>
            <h1 class="font-ewc text-base font-black text-slate-900 tracking-wider">EDIT PROFILE</h1>
            <div class="w-9"></div>
        </header>

        <section class="flex flex-col items-center px-5 mb-6 mt-4">
            <div class="relative mb-3 cursor-pointer" onclick="document.getElementById('avatar-file').click()">
                <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-slate-900 to-amber-500 shadow-xl">
                    <img id="profile-avatar" src="" class="w-full h-full rounded-full object-cover border-4 border-white" onerror="this.onerror=null;this.src='https://ui-avatars.com/api/?background=0F131C&color=CCFF00&bold=true&name=PD'">
                </div>
                <div class="absolute bottom-0 right-0 w-7 h-7 bg-[#070A10] border-2 border-white rounded-md flex items-center justify-center shadow-lg">
                    <svg class="w-3.5 h-3.5 text-[#CCFF00]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </div>
                <input type="file" id="avatar-file" accept="image/*" class="hidden">
            </div>
            <span id="p-email" class="font-ewc text-xs font-bold text-slate-500 tracking-wide">email@example.com</span>
        </section>

        <div class="px-5 space-y-6">
            <div class="space-y-2">
                <h3 class="section-head px-1">Profile Details</h3>
                <div class="info-group divide-y divide-slate-200">
                    <div class="p-4 space-y-1.5">
                        <label class="font-ewc text-[10px] font-bold text-slate-500 uppercase tracking-wider">Full name</label>
                        <input type="text" id="input-name" class="ewc-input" placeholder="Your full name" autocomplete="name">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="font-ewc text-[10px] font-bold text-slate-500 uppercase tracking-wider">Mobile number</label>
                        <input type="tel" id="input-mobile" class="ewc-input" placeholder="Enter mobile number" autocomplete="tel">
                    </div>
                    <div class="p-4 space-y-1.5">
                        <label class="font-ewc text-[10px] font-bold text-slate-500 uppercase tracking-wider">Address</label>
                        <input type="text" id="input-address" class="ewc-input" placeholder="Enter your address" autocomplete="street-address">
                    </div>
                    <div class="p-4 space-y-1.5 locked-field" style="background:#F1F5F9;">
                        <label class="font-ewc text-[10px] font-bold text-slate-500 uppercase tracking-wider">Email (locked)</label>
                        <input type="email" id="input-email" class="ewc-input" disabled>
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <h3 class="section-head px-1">Security</h3>
                <div class="info-group">
                    <button id="btn-change-password" class="p-4 w-full flex items-center justify-between active:bg-slate-50 transition-colors" style="border:none;background:transparent;cursor:pointer;">
                        <div class="flex items-center gap-3.5">
                            <div class="w-[38px] h-[38px] rounded-lg flex items-center justify-center shrink-0 border border-[rgba(7,10,16,0.12)]" style="background:rgba(34,197,94,0.12);color:#15803D;">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 11c0 3-1 6-3 8M12 2a10 10 0 00-7 17M12 6a7 7 0 00-5 12M12 15a2 2 0 100-4 2 2 0 000 4z"/></svg>
                            </div>
                            <span class="font-ewc text-[13px] font-bold text-slate-900 uppercase">Change password</span>
                        </div>
                        <svg class="w-3.5 h-3.5 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square"><path d="M9 18l6-6-6-6"/></svg>
                    </button>
                </div>
            </div>

            <div class="flex flex-col gap-3 pb-6">
                <button class="btn-save" id="btn-save">Save changes</button>
                <a href="profile.html" class="btn-outline flex items-center justify-center no-underline">Cancel</a>
            </div>
        </div>
    </div>

    <nav class="app-bottom-nav">
        <a href="home.html" class="nav-item">
            <svg class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </a>
        <a href="wallet.html" class="nav-item">
            <svg class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M21 18V6H3v12h18zm-2-2H5V8h14v8zm-3-5h2v2h-2v-2z"/></svg>
            <span>Wallet</span>
        </a>
        <a href="PLAY.html" class="nav-item">
            <svg class="w-6 h-6 shrink-0" fill="none" viewBox="0 0 26 26"><g><path d="M 11.2526,18.942 C 11.1678,18.8317 11.1341,18.6996 11.173599999999999,18.575499999999998 C 11.2098,18.4603 11.2732,18.3725 11.4066,18.3161 L 17.543999999999997,15.6949 C 17.6946,15.630399999999998 17.7934,15.5458 17.8256,15.408100000000001 C 17.865099999999998,15.238900000000001 17.7967,15.1294 17.6913,15.005299999999998 L 14.206,10.8881 C 14.077599999999999,10.735899999999999 14.1204,10.516 14.2349,10.3919 C 14.3567,10.2606 14.5823,10.1873 14.7462,10.3017 L 23.3923,16.3409 C 23.5298,16.436799999999998 23.5858,16.5914 23.5537,16.749299999999998 C 23.528999999999996,16.8702 23.426899999999996,17.0305 23.261400000000002,17.0595 L 11.655199999999999,19.0838 C 11.4955,19.112 11.346499999999999,19.0661 11.2518,18.9428 L 11.2526,18.942" fill="currentColor"/><path d="M 13.049199999999999,7.78121 C 12.8384,7.629759999999999 12.549399999999999,7.740119999999999 12.465399999999999,7.96326 L 10.5412,13.0261 C 10.4712,13.2098 10.3066,13.3097 10.111429999999999,13.284699999999999 C 9.845479999999998,13.2533 9.69069,13.0221 9.75244,12.761099999999999 L 10.7652,2.53064 C 10.784099999999999,2.34294 10.938099999999999,2.2237199999999997 11.100299999999999,2.1915 C 11.296299999999999,2.15203 11.431299999999998,2.25514 11.552299999999999,2.3952999999999998 L 19.0038,11.0525 C 19.095999999999997,11.159699999999999 19.1841,11.266 19.1685,11.4062 C 19.1438,11.6229 18.9651,11.7945 18.741099999999996,11.7961 C 18.6464,11.7961 18.5616,11.7526 18.4842,11.6962 L 13.049199999999999,7.78121" fill="currentColor"/><path d="M 14.733799999999999,15.4783 C 14.7412,15.6419 14.6646,15.7804 14.517199999999999,15.846499999999999 L 4.821249999999999,20.161 C 4.715039999999999,20.1924 4.648339999999999,20.1892 4.5495399999999995,20.1505 C 4.370049999999999,20.0805 4.221019999999999,19.8734 4.2967699999999995,19.668 L 8.331259999999999,8.7697 C 8.407839999999998,8.5619 8.673779999999999,8.51357 8.85245,8.58123 C 9.015479999999998,8.64326 9.092049999999999,8.7633 9.11923,8.934099999999999 L 8.36749,15.4832 C 8.35102,15.627400000000002 8.346079999999999,15.7498 8.442419999999998,15.857 C 8.52723,15.9512 8.657319999999999,16.0189 8.813759999999998,15.993099999999998 L 14.2595,15.089300000000001 C 14.508199999999999,15.048200000000001 14.722199999999999,15.2254 14.734599999999999,15.4783 L 14.733799999999999,15.4783" fill="currentColor"/></g></svg>
            <span>Play</span>
        </a>
        <a href="stats.html" class="nav-item">
            <svg class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M5 19h14v2H3V3h2v16zm4-8h3v7H9v-7zm5-5h3v12h-3V6z"/></svg>
            <span>Stats</span>
        </a>
        <a href="profile.html" class="nav-item active-ewc">
            <svg class="w-6 h-6 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <div id="toast" class="toast"></div>

    <div class="modal-overlay" id="password-modal">
        <div class="modal-box">
            <h3 class="font-ewc text-base font-black text-slate-900 text-center mb-1">Change Password</h3>
            <p class="text-xs font-bold text-slate-500 text-center mb-4">Enter current password and new password</p>
            <div class="space-y-3">
                <input type="password" id="pw-current" class="ewc-input" placeholder="Current password">
                <input type="password" id="pw-new" class="ewc-input" placeholder="New password (6+ chars)">
                <input type="password" id="pw-confirm" class="ewc-input" placeholder="Confirm new password">
            </div>
            <div class="flex gap-2 mt-4">
                <button class="btn-outline" id="pw-cancel" style="height:44px;font-size:11px">Cancel</button>
                <button class="btn-save" id="pw-submit" style="height:44px;font-size:11px">Update</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase.js';
        import { requireAuth } from './authGuard.js';
        import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
        import { updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

        var user, userData;

        function toast(msg) {
            var el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            setTimeout(function() { el.classList.remove('show'); }, 2500);
        }

        try {
            user = await requireAuth();

            var emailEl = document.getElementById('input-email');
            emailEl.value = user.email || '';

            try {
                var snap = await getDoc(doc(db, 'users', user.uid));
                if (snap.exists()) {
                    userData = snap.data();
                    document.getElementById('input-name').value = userData.name || '';
                    document.getElementById('input-mobile').value = userData.mobile || '';
                    document.getElementById('input-address').value = userData.address || '';
                    var avatarEl = document.getElementById('profile-avatar');
                    if (userData.profilePhoto) avatarEl.src = userData.profilePhoto;
                    if (window.NovaPay && NovaPay.state.profile.avatar) {
                        avatarEl.src = NovaPay.state.profile.avatar;
                    }
                }
            } catch(e) {}

            document.body.classList.add('loaded');
        } catch(e) {
            window.location.replace('login.html');
            return;
        }

        document.getElementById('btn-save').addEventListener('click', async function() {
            var name = document.getElementById('input-name').value.trim();
            var mobile = document.getElementById('input-mobile').value.trim();
            var address = document.getElementById('input-address').value.trim();

            document.querySelectorAll('.ewc-input').forEach(function(el) { el.classList.remove('error'); });
            if (!name) { document.getElementById('input-name').classList.add('error'); toast('Name is required'); return; }
            if (!mobile) { document.getElementById('input-mobile').classList.add('error'); toast('Mobile is required'); return; }

            var btn = document.getElementById('btn-save');
            btn.disabled = true;
            btn.textContent = 'Saving...';

            var updateData = { name: name, mobile: mobile };
            if (address) updateData.address = address;

            try {
                await updateDoc(doc(db, 'users', user.uid), updateData);
                if (window.NovaPay) {
                    NovaPay.setProfile({
                        name: name,
                        handle: name.toUpperCase().replace(/\s+/g, '_').slice(0, 12)
                    });
                }
                toast('Profile saved');
            } catch(e) {
                toast('Save failed — try again');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Save changes';
            }
        });

        document.getElementById('avatar-file').addEventListener('change', async function(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var dataUrl = ev.target.result;
                document.getElementById('profile-avatar').src = dataUrl;
                if (window.NovaPay) {
                    NovaPay.setProfile({ avatar: dataUrl });
                }
            };
            reader.readAsDataURL(file);
        });

        var pwModal = document.getElementById('password-modal');
        document.getElementById('btn-change-password').addEventListener('click', function() {
            pwModal.classList.add('show');
        });
        document.getElementById('pw-cancel').addEventListener('click', function() {
            pwModal.classList.remove('show');
        });
        document.getElementById('password-modal').addEventListener('click', function(e) {
            if (e.target === pwModal) pwModal.classList.remove('show');
        });

        document.getElementById('pw-submit').addEventListener('click', async function() {
            var current = document.getElementById('pw-current').value;
            var newPw = document.getElementById('pw-new').value;
            var confirm = document.getElementById('pw-confirm').value;

            [current, newPw, confirm].forEach(function() {
                document.querySelectorAll('#password-modal .ewc-input').forEach(function(el) { el.classList.remove('error'); });
            });

            if (!current) { document.getElementById('pw-current').classList.add('error'); toast('Enter current password'); return; }
            if (!newPw || newPw.length < 6) { document.getElementById('pw-new').classList.add('error'); toast('New password must be 6+ chars'); return; }
            if (newPw !== confirm) { document.getElementById('pw-confirm').classList.add('error'); toast('Passwords do not match'); return; }

            var btn = document.getElementById('pw-submit');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                var credential = EmailAuthProvider.credential(user.email, current);
                await reauthenticateWithCredential(user, credential);
                await updatePassword(user, newPw);
                pwModal.classList.remove('show');
                toast('Password updated');
                document.getElementById('pw-current').value = '';
                document.getElementById('pw-new').value = '';
                document.getElementById('pw-confirm').value = '';
            } catch(e) {
                var msg = 'Update failed';
                if (e.code === 'auth/wrong-password') msg = 'Current password is incorrect';
                else if (e.code === 'auth/weak-password') msg = 'Password too weak';
                else if (e.code === 'auth/too-many-requests') msg = 'Too many attempts — try later';
                toast(msg);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Update';
            }
        });
    </script>
    <script src="haptics.js?v=16" defer></script>
</body>
</html>
