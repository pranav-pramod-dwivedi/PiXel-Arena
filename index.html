<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL ARENA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap');
        
        body {
            margin: 0;
            background-color: #0052FF;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.8s ease;
        }

        #stage {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0052FF 0%, #0035A3 100%);
            transition: opacity 0.6s ease;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .iconic-text {
            font-size: 3rem;
            font-weight: 800;
            color: white;
            letter-spacing: 6px;
            opacity: 0;
            transform: translateX(-150vw) scaleX(5);
            animation: iconicStreak 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes iconicStreak {
            0% {
                opacity: 0;
                transform: translateX(-150vw) scaleX(5);
                filter: blur(30px);
            }
            30% {
                opacity: 1;
                filter: blur(15px);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scaleX(1);
                filter: blur(0);
            }
        }

        .battle-box {
            background-color: white;
            color: #0052FF;
            padding: 4px 12px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 1.4rem;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: scale(0.4) rotate(-10deg);
            animation: battleEvolve 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.7s forwards;
        }

        @keyframes battleEvolve {
            0% {
                opacity: 0;
                transform: scale(0.4) rotate(-10deg);
                filter: blur(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
                filter: blur(0);
            }
        }

        #fade-overlay {
            position: fixed;
            inset: 0;
            background-color: white;
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-to-white {
            opacity: 1 !important;
        }

        .ambient-light {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.08);
            filter: blur(120px);
            border-radius: 50%;
            z-index: -1;
            animation: moveGlow 6s infinite alternate;
        }

        @keyframes moveGlow {
            from { transform: translate(-10%, -10%) scale(1); }
            to { transform: translate(10%, 10%) scale(1.2); }
        }
    </style>
</head>
<body>

    <div id="fade-overlay"></div>

    <div id="stage">
        <div class="ambient-light"></div>
        
        <div class="brand-container">
            <span class="iconic-text">PIXEL</span>
            <div class="battle-box">Arena</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const overlay = document.getElementById('fade-overlay');

            setTimeout(() => {
                overlay.classList.add('fade-to-white');
                setTimeout(() => {
                    window.location.replace('login.html');
                }, 800);
            }, 2600);
        };
    </script>
</body>
</html>
