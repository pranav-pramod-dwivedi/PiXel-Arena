<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auth Test | Pixel Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0B1120; color: #fff; min-height: 100vh; opacity: 0; }
        body.auth-ready { opacity: 1; }
        .num { font-family: 'Space Grotesk', sans-serif; }
        .glass { background: rgba(15,23,42,0.65); backdrop-filter: blur(30px) saturate(150%); border: 1px solid rgba(255,255,255,0.12); box-shadow: inset 0 1px 0 rgba(255,255,255,0.05); }
        .field { background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 14px 16px; }
        .field-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #94a3b8; margin-bottom: 6px; }
        .field-value { font-family: 'Space Grotesk', monospace; font-size: 13px; font-weight: 600; color: #fff; word-break: break-all; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .status-dot.online { background: #10b981; box-shadow: 0 0 8px rgba(16,185,129,0.6); }
        .page { animation: pageIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes pageIn { 0%{opacity:0;transform:scale(0.95) translateY(10px);filter:blur(8px)} 100%{opacity:1;transform:scale(1) translateY(0);filter:blur(0)} }
        .btn { width: 100%; height: 50px; border-radius: 16px; border: none; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; transition: transform 0.16s; }
        .btn:active { transform: scale(0.96); }

        #authLoader {
            position: fixed; inset: 0; z-index: 9999;
            background: #0B1120;
            display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
            transition: opacity 0.3s ease;
        }
        #authLoader.hide { opacity: 0; pointer-events: none; }
        #authLoader .spinner { width: 36px; height: 36px; border: 3px solid rgba(59,130,246,0.2); border-top-color: #3b82f6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="authLoader">
        <div class="spinner"></div>
        <p class="text-sm" style="color:#64748b">Verifying authentication...</p>
    </div>

    <div id="content" class="hidden" style="padding: 24px 20px; max-width: 440px; margin: 0 auto;">
        <div class="page">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <h1 class="text-xl font-extrabold">Auth Status</h1>
                    <p class="text-xs mt-1" style="color:#64748b">Firebase Authentication Test</p>
                </div>
                <div class="glass flex items-center gap-2 px-3 py-1.5 rounded-full">
                    <span class="status-dot online"></span>
                    <span class="text-xs font-bold" style="color:#10b981">Signed In</span>
                </div>
            </div>

            <div class="glass rounded-3xl p-5 mb-4">
                <p class="text-[11px] font-bold uppercase tracking-wider mb-3" style="color:#94a3b8">Session Info</p>
                <div class="field mb-3"><div class="field-label">UID</div><div class="field-value" id="uid">-</div></div>
                <div class="field mb-3"><div class="field-label">Email</div><div class="field-value" id="email">-</div></div>
                <div class="field mb-3"><div class="field-label">Display Name</div><div class="field-value" id="displayName">-</div></div>
                <div class="field mb-3"><div class="field-label">Phone</div><div class="field-value" id="phone">-</div></div>
                <div class="field mb-3"><div class="field-label">Photo URL</div><div class="field-value" id="photoUrl">-</div></div>
                <div class="field mb-3"><div class="field-label">Email Verified</div><div class="field-value" id="emailVerified">-</div></div>
                <div class="field"><div class="field-label">Provider</div><div class="field-value" id="provider">-</div></div>
            </div>

            <div class="glass rounded-3xl p-5 mb-4">
                <p class="text-[11px] font-bold uppercase tracking-wider mb-3" style="color:#94a3b8">Firestore: users/<span id="firestoreId" class="text-blue-400"></span></p>
                <div id="firestoreData" class="text-sm" style="color:#64748b">Loading...</div>
            </div>

            <div class="glass rounded-3xl p-5 mb-6">
                <p class="text-[11px] font-bold uppercase tracking-wider mb-3" style="color:#94a3b8">ID Token (first 80 chars)</p>
                <div class="field"><div class="field-value" id="idToken" style="color:#64748b">Loading...</div></div>
            </div>

            <button class="btn mb-3" style="background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;box-shadow:0 10px 24px rgba(29,78,216,0.45)" onclick="location.href='home.html'">
                <i class="fa-solid fa-house mr-2"></i> Go to Home
            </button>
            <button class="btn" style="background:rgba(239,68,68,0.15);color:#ef4444;border:1px solid rgba(239,68,68,0.3)" onclick="signOutUser()">
                <i class="fa-solid fa-right-from-bracket mr-2"></i> Sign Out
            </button>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logoutUser } from './authGuard.js';
        import { auth, db } from './firebase.js';
        import { signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

        let user;
        try {
            user = await requireAuth();
        } catch (e) {
            return;
        }

        document.getElementById('content').classList.remove('hidden');
        document.getElementById('authLoader').classList.add('hide');
        document.body.classList.add('auth-ready');

        document.getElementById('uid').textContent = user.uid;
        document.getElementById('email').textContent = user.email || '(none)';
        document.getElementById('displayName').textContent = user.displayName || '(none)';
        document.getElementById('phone').textContent = user.phoneNumber || '(none)';
        document.getElementById('photoUrl').textContent = user.photoURL || '(none)';
        document.getElementById('emailVerified').textContent = user.emailVerified ? 'Yes' : 'No';
        document.getElementById('firestoreId').textContent = user.uid;

        const providers = user.providerData.map(p => p.providerId).join(', ');
        document.getElementById('provider').textContent = providers || '(unknown)';

        try {
            const token = await user.getIdToken(true);
            document.getElementById('idToken').textContent = token.substring(0, 80) + '...';
        } catch (e) {
            document.getElementById('idToken').textContent = 'Error: ' + e.message;
        }

        try {
            const userDoc = await getDoc(doc(db, 'users', user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('firestoreData').innerHTML = Object.entries(data).map(([key, val]) => {
                    const display = typeof val === 'object' ? JSON.stringify(val) : String(val);
                    return `<div class="field mb-2"><div class="field-label">${key}</div><div class="field-value">${display}</div></div>`;
                }).join('');
            } else {
                document.getElementById('firestoreData').innerHTML = '<p style="color:#f59e0b">No document found at users/' + user.uid + '</p>';
            }
        } catch (e) {
            document.getElementById('firestoreData').innerHTML = '<p style="color:#ef4444">Error: ' + e.message + '</p>';
        }

        window.signOutUser = logoutUser;
    </script>
</body>
</html>
